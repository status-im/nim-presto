[book]
authors = ["Constantine Molchanov"]
language = "en"
multilingual = false
src = "src"
title = "Presto"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
max-level = 2

[preprocessor.open-on-gh]
command = "mdbook-open-on-gh"
renderer = ["html"]
git-branch = "master"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0"    # do not edit: managed by `mdbook-admonish install`

[preprocessor.shiftinclude]

[output.html]
git-repository-url = "https://github.com/status-im/nim-presto/"
git-branch = "master"
additional-css = ["./open-in.css", "./mdbook-admonish.css"]

[output.html.fold]
enable = true
