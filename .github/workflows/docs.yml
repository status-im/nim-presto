name: Docgen
on:
  push:
    branches:
      - master
      - docs
  workflow_dispatch:

jobs:
  docs:
    uses: status-im/nimbus-common-workflow/.github/workflows/docs.yml@main
    with:
      mdbook-version: "0.4.52"
      mdbook-preprocessors: >-
        [
          "mdbook-toc@0.14.2",
          "mdbook-open-on-gh@2.4.3",
          "mdbook-admonish@1.20.0",
          "mdbook-shiftinclude@0.1"
        ]
      docs-command: |
        nimble install -dy
        nimble examples
        nimble docs
